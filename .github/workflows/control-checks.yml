name: Control OLT checks
on:
  push:
    branches: [feature/olt-control]
  pull_request:
    paths: ['control-olt/**', '.github/workflows/control-checks.yml']
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-olt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: control-olt/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test
      - run: npm run build
